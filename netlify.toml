# ═══════════════════════════════════════════════════════════════
#  Netlify Functions
# ═══════════════════════════════════════════════════════════════
[functions]
  directory = "netlify/functions"

# ═══════════════════════════════════════════════════════════════
#  Redirects — expone las funciones en /api/*
# ═══════════════════════════════════════════════════════════════
[[redirects]]
  from = "/api/verify-recaptcha"
  to = "/.netlify/functions/verify-recaptcha"
  status = 200

[[redirects]]
  from = "/api/verify-captcha"
  to = "/.netlify/functions/verify-captcha"
  status = 200

# ═══════════════════════════════════════════════════════════════
#  Cabeceras de seguridad (sin cambios)
# ═══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; connect-src 'self' https://wa.me https://www.google.com https://www.gstatic.com; frame-src https://www.google.com https://recaptcha.google.com; base-uri 'self'; form-action 'self'; object-src 'none';"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon_io/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"